<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Telegram Job Deduper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Job Deduper</h1>
    <p id="channelHint" class="hint"></p>
    <button id="open" type="button"></button>
    <label class="row"><input id="enabled" type="checkbox" /> Enabled</label>
    <label class="row"><input id="hideDuplicates" type="checkbox" /> Hide repeats in the chat</label>
    <label class="row"><input id="onlyNew" type="checkbox" /> Hide jobs already marked read</label>
    <label class="slider">
      <span>Similarity <b id="thresholdLabel">72%</b></span>
      <input id="threshold" type="range" min="65" max="95" step="1" />
    </label>
    <p class="hint">72% treats a lightly edited repost as the same job. Raise it if different jobs from one company get merged. A full rewrite still looks new.</p>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
